<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a1f">
<title>Zona Game</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="./"><i>🎮</i>Zona Game</a>
    <label class="search">
      <input id="q" type="search" placeholder="Cari game…" aria-label="Cari game" autocomplete="off">
    </label>
  </div>
</header>

<div class="cats" id="cats" role="group" aria-label="Kategori"></div>

<main class="wrap">
  <div id="topSec">
    <h2>Game teratas hari ini</h2>
    <a class="hero" id="hero" href="#"></a>
  </div>
  <h2 id="gridTitle">Semua game</h2>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<nav aria-label="Menu utama"><div class="in">
  <button id="nHome" aria-current="true"><span>🏠</span>Beranda</button>
  <button id="nSearch"><span>🔍</span>Cari</button>
  <button id="nFav"><span>❤️</span>Game saya</button>
</div></nav>

<!-- games.js = daftar game (file yang kamu edit). app.js = logika, tidak perlu disentuh -->
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
